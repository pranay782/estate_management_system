{% extends "base.html" %}
{% block title %}Sign in | EstatePro{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card">
  <span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p>Access your EstatePro workspace.</p>
  <form method="post" class="form-grid single">
    <label>Email or username<input name="identity" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-gold full">Sign in →</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
